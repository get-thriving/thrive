[project]
name = "jupiter_webapi_client"
version = "1.3.3"
description = "A client library for accessing Thrive is a tool for life planning"
authors = []
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx2>=2.13.1,<3",
    "attrs>=22.2.0",
]

[tool.uv.build-backend]
module-name = "jupiter_webapi_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
