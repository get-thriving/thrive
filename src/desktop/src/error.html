<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}} - Error</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
          "Helvetica Neue", Arial, sans-serif;
        font-size: 20px;
        background-color: #fcfaf9;
        color: #211e1d;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #171513;
          color: #f3eeeb;
        }
      }

      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>There was an error with the application.</p>

      <p>Check network connectivity.</p>

      <p>
        <span>You can</span>
        <a href="index.html"><button>Retry</button></a>
        <span>or</span>
        <a href="index.html?hostedGlobal=true"
          ><button>Retry on the global server</button></a
        >
        <span>or</span>
        <button id="exit" onClick="exit()">Exit</button>
      </p>
    </div>
  </body>

  <script>
    async function exit() {
      await lifecycle.exit();
    }
  </script>
</html>
