[project]
name = "jupiter-webapi-gen-do-all"
version = "0.1.0"
description = "A Web RPC-ish API for Thrive."
authors = [{ name = "Mike Bestcat", email = "mike@get-thriving.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "jupiter-core",
    "jupiter-framework",
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54.0,<0.55",
    "pydantic>=2.10.6,<3",
    "websockets>=17.1,<18",
    "gunicorn>=26.2.0,<27",
    "python-multipart>=0.0.32,<0.0.33",
    "apscheduler>=3.11.0,<4",
    "inflection>=0.5.1,<0.6",
    "wsproto>=1.2.0,<2",
    "aiodns>=4.0.4,<5",
]

[project.urls]
Homepage = "https://get-thriving.com"
Repository = "https://github.com/get-thriving/thrive"
Documentation = "https://docs.get-thriving.com"

[dependency-groups]
dev = ["types-requests>=2.32.0,<3"]

[tool.uv]
package = false

[tool.uv.sources]
jupiter-core = { workspace = true }
jupiter-framework = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
