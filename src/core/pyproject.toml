[project]
name = "jupiter-core"
version = "0.1.0"
description = "The core business logic for Thrive."
authors = [{ name = "Mike Bestcat", email = "mike@get-thriving.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "pendulum>=3.1.0,<4",
    "python-dotenv>=1.0.1,<2",
    "pytz>=2026.4,<2027",
    "requests>=2.32.3,<3",
    "SQLAlchemy>=2.0.44,<2.1",
    "alembic>=1.15.1,<2",
    "coverage>=7.7.0,<8",
    "emoji>=2.14.1,<3",
    "jupiter-framework",
    "rich>=15.0.0,<16",
    "email-validator>=2.2.0,<3",
    "aiosqlite>=0.22.1,<0.23",
    "greenlet>=3.1.1,<4",
    "validators>=0.35.0,<0.36",
    "argon2-cffi>=25.1.0,<26",
    "cffi>=2.1.1,<3",
    "pyjwt>=2.10.1,<3",
    "avinit>=1.3.0,<2",
    "inflection>=0.5.1,<0.6",
    "typing-extensions>=4.12.2,<5",
    "pydantic>=2.10.6,<3",
    "cryptography>=50.0.2,<51",
    "icalendar>=7.3.0,<8",
    "recurring-ical-events>=3.6.0,<4",
    "algoliasearch>=4.0,<5.0",
    "asyncpg>=0.31.0",
    "authlib>=1.6.12",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://get-thriving.com"
Repository = "https://github.com/get-thriving/thrive"
Documentation = "https://docs.get-thriving.com"

[dependency-groups]
dev = [
    "types-requests>=2.32.0,<3",
    "types-icalendar>=6.1.0,<8",
    "types-authlib>=1.6.11.20260518",
]

[tool.uv]

[tool.uv.sources]
jupiter-framework = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["jupiter"]

[tool.hatch.build.targets.wheel]
include = ["jupiter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
