[project]
name = "jupiter-api"
version = "0.1.0"
description = "An API used by external entities to access Thrive programmatically.."
authors = [{ name = "Mike Bestcat", email = "mike@get-thriving.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "jupiter-framework",
    "jupiter-webapi-client",
    "jupiter-core",
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54.0,<0.55",
    "pydantic>=2.10.6,<3",
    "gunicorn>=26.2.0,<27",
    "python-multipart>=0.0.32,<0.0.33",
    "apscheduler>=3.11.0,<4",
    "inflection>=0.5.1,<0.6",
    "wsproto>=1.2.0,<2",
    "aiodns>=4.0.4,<5",
    "python-dotenv>=1.0.1,<2",
    "greenlet>=3.1.1,<4",
    "argon2-cffi>=25.1.0,<26",
    "cffi>=2.1.1,<3",
]

[project.urls]
Homepage = "https://get-thriving.com"
Repository = "https://github.com/get-thriving/thrive"
Documentation = "https://docs.get-thriving.com"

[dependency-groups]
dev = ["types-requests>=2.32.0,<3"]

[tool.uv]
package = false

[tool.uv.sources]
jupiter-framework = { workspace = true }
jupiter-webapi-client = { workspace = true }
jupiter-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
