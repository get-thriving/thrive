["package:src:docs:prepare"]
hide = true
run = "true"

["package:src:docs:fix:black"]
hide = true
sources = ["src/docs/screenshots/**/*.py"]
outputs = { auto = true }
run = "uv run black src/docs/screenshots"

["package:src:docs:fix:ruff"]
hide = true
sources = ["src/docs/screenshots/**/*.py"]
outputs = { auto = true }
run = "uv run ruff check --cache-dir=.build-cache/ruff --config=./tasks/_resources/check/lint/ruff.toml src/docs/screenshots --fix"

["package:src:docs:fix:markdownlint"]
hide = true
sources = ["src/docs/**/*.md"]
outputs = { auto = true }
run = "./tasks/_resources/check/lint/markdownlint-cli2.sh --fix 'src/docs/**/*.md'"

["package:src:docs:fix"]
description = "Fix src/docs module"
depends = ["package:src:docs:fix:*"]
run = "true"

["package:src:docs:libyear:libyear-toml"]
hide = true
run = "libyear toml src/docs/pyproject.toml"

["package:src:docs:libyear"]
description = "Check src/docs libyear"
depends = ["package:src:docs:libyear:*"]
run = "true"

["package:src:docs:lint:toml"]
hide = true
sources = ["src/docs/package.mise.toml"]
outputs = { auto = true }
run = "npx eslint src/docs/package.mise.toml"

["package:src:docs:lint:ruff"]
hide = true
sources = ["src/docs/screenshots/**/*.py"]
outputs = { auto = true }
run = "uv run ruff check --cache-dir=.build-cache/ruff --config=./tasks/_resources/check/lint/ruff.toml src/docs/screenshots"

["package:src:docs:lint:pyflakes"]
hide = true
sources = ["src/docs/screenshots/**/*.py"]
outputs = { auto = true }
run = "uv run pyflakes src/docs/screenshots"

["package:src:docs:lint:bandit"]
hide = true
sources = ["src/docs/screenshots/**/*.py"]
outputs = { auto = true }
run = "uv run bandit --configfile=./tasks/_resources/check/lint/bandit --ini=./tasks/_resources/check/lint/bandit.test.ini -r src/docs/screenshots"

["package:src:docs:lint:pydocstyle"]
hide = true
sources = ["src/docs/screenshots/**/*.py"]
outputs = { auto = true }
run = "uv run pydocstyle --config=./tasks/_resources/check/lint/pydocstyle src/docs/screenshots"

["package:src:docs:lint:yamllint"]
hide = true
sources = [
  "src/docs/**/*.yml",
  "src/docs/**/*.yaml",
]
outputs = { auto = true }
run = "uv run yamllint --config-file=./tasks/_resources/check/lint/yamllint src/docs/mkdocs.yml"

["package:src:docs:lint:markdownlint-docs"]
hide = true
sources = ["src/docs/**/*.md"]
outputs = { auto = true }
run = "./tasks/_resources/check/lint/markdownlint-cli2.sh 'src/docs/**/*.md'"

["package:src:docs:lint"]
description = "Check src/docs module"
depends = ["package:src:docs:lint:*"]
run = "true"
