# -- The calendar -----------------------------------------------------------

[[seed]]
op = "schedule.schedule_stream_find"
args = {}
saves = [{ name = "stream", path = "entries.0.schedule_stream.ref_id" }]

[[seed]]
op = "schedule.schedule_stream_create_for_user"
foreach = [{ name = "Work", color = "green" }, { name = "Family", color = "orange" }]
args = "{{ item }}"
save = "stream_{{ item['name'].lower() }}"

# A regular week, repeated for five weeks around today, plus a few one-offs.
# Each row is: day of the week (0 is Monday), name, start, minutes, stream.
[[seed]]
op = "schedule.schedule_event_in_day_create"
foreach = '''{{ [
  {'schedule_stream_ref_id': ref(s), 'name': n, 'start_date': day(k), 'start_time_in_day': utc(t, k), 'duration_mins': m}
  for k in range(-14, 22)
  for (wd, n, t, m, s) in [
    (0, 'Team sync', '10:00', 45, 'stream_work'),
    (2, 'Team sync', '10:00', 45, 'stream_work'),
    (4, 'Team sync', '10:00', 45, 'stream_work'),
    (0, 'Project planning', '14:00', 90, 'stream_work'),
    (1, 'Design review', '11:00', 60, 'stream_work'),
    (3, 'One to one with Sam', '15:30', 30, 'stream_work'),
    (4, 'Plan the week', '08:30', 30, 'stream_work'),
    (1, 'Gym', '18:30', 75, 'stream'),
    (3, 'Gym', '18:30', 75, 'stream'),
    (0, 'Spanish class', '19:00', 90, 'stream'),
    (2, 'Lunch with Elena', '13:00', 60, 'stream'),
    (4, 'Call with Oliver', '16:00', 30, 'stream'),
    (5, 'Run: long slow', '08:00', 120, 'stream'),
    (5, 'Farmers market', '10:30', 60, 'stream_family'),
    (6, 'Family brunch', '11:00', 120, 'stream_family'),
    (6, 'Read in the park', '15:00', 90, 'stream'),
    (2, 'Standup', '09:15', 15, 'stream_work'),
    (2, 'Sprint demo', '15:00', 60, 'stream_work'),
    (2, 'Pottery class', '18:30', 90, 'stream'),
  ]
  if weekday(k) == wd
] }}'''
args = "{{ item }}"

[[seed]]
op = "schedule.schedule_event_in_day_create"
foreach = [
  { name = "Dentist", offset = 1, time = "09:30", mins = 45, stream = "stream" },
  { name = "Birthday dinner for Elena", offset = 5, time = "19:30", mins = 150, stream = "stream_family" },
