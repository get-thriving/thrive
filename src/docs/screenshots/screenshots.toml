# ===========================================================================
# THE SHOTS
#
# `name`: the file in .build-cache/docs-screenshots/out.
# `assets`: where to install the picture, relative to src/docs/material. The
#     same picture can go to many places.
# `path`: where to go. Optional `profile` (desktop by default), `login`
#     (true by default), `settle_ms`, `clip`, `retries`.
# `steps`: what to do on the page before taking the picture, see README.md.
# `continue_from_previous`: stay on the page the previous shot ended on.
# ===========================================================================

# -- The home screen --------------------------------------------------------

[[shot]]
name = "home-page"
assets = ["assets/home-page.png", "assets/showcase/home-page.png"]
path = "/app/workspace"

