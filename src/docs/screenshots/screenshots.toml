[[seed]]
op = "metrics.metric_entry_create"
foreach = "{{ [{'metric_ref_id': ref('metric_0'), 'value': round(84.0 - 0.3 * k + (0.2 if k % 3 == 0 else -0.1), 1), 'collection_time': day(-(11 - k) * 7)} for k in range(12)] }}"
args = "{{ item }}"

[[seed]]
op = "metrics.metric_entry_create"
