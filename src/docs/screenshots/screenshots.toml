# The pictures of the docs: who the demo user is, what data the demo workspace
# holds, and which screens to take pictures of. Read README.md first.
#
# Run it with `mise run build:docs-screenshots`.

# ---------------------------------------------------------------------------
# The demo user and workspace. These are created on a fresh instance.
# ---------------------------------------------------------------------------

[user]
email = "docs-demo@example.com"
name = "Alex Rivera"
password = "docs-demo-password-1"
timezone = "Europe/Bucharest"
birthday = "12 Sep"
birth_year = 1990
workspace_name = "Alex's Workspace"
root_aspect = "Life"
first_stream = "Life"
features = ["gamification"]

[workspace]
# Everything, except the integrations that need an external service.
features = [
  "big-plans", "chores", "docs", "habits", "journals", "life-plan", "metrics",
  "prm", "schedule", "smart-lists", "time-plans", "todo-task", "vacations",
  "working-mem",
]

# ---------------------------------------------------------------------------
# The kinds of screens. A shot picks one with `profile = "..."`.
# ---------------------------------------------------------------------------

[profile.desktop]
width = 1500
height = 926
scale = 1.5

[profile.mobile]
width = 390
height = 844
scale = 2
mobile = true

# A tall window, for the month and year of the calendar.
[profile.tall]
width = 1500
height = 1500
scale = 1.5

# Small windows for the forms of the logged out screens.
[profile.form]
width = 1100
height = 470
scale = 2

# ===========================================================================
# THE DATA
#
# Each [[seed]] is one call to the WebAPI, or one call per item of `foreach`.
# `op` is the module of the client (`gen/py/webapi-client/.../api/<op>.py`),
# `args` the body of the call. `save = "name"` remembers the id of what was
# created, to use later as `{{ ref("name") }}`. Dates are `{{ day(n) }}`, n days
# from today, so the data always looks current.
# ===========================================================================

# -- Habits -----------------------------------------------------------------

[[seed]]
op = "habits.habit_create"
foreach = [
  { name = "Get at least 7h30m of quality sleep", period = "daily", is_key = true, eisen = "important", difficulty = "easy" },
  { name = "Go for a walk for at least 15 minutes", period = "daily", is_key = false, eisen = "regular", difficulty = "easy" },
  { name = "Drink at least 8 glasses of water", period = "daily", is_key = false, eisen = "regular", difficulty = "easy" },
  { name = "Stretch for 10 minutes", period = "daily", is_key = false, eisen = "regular", difficulty = "easy" },
  { name = "Read for half an hour", period = "daily", is_key = true, eisen = "important", difficulty = "medium" },
]
args = "{{ item }}"
save = "habit_{{ i }}"

[[seed]]
op = "habits.habit_create"
save = "habit_5"
[seed.args]
name = "Go to the gym"
period = "weekly"
is_key = true
eisen = "important"
difficulty = "hard"
repeats_strategy = "spread-out-no-overlap"
repeats_in_period_count = 3

[[seed]]
op = "habits.habit_create"
foreach = [
  { name = "Call a friend", period = "weekly", is_key = false, eisen = "regular", difficulty = "easy" },
  { name = "Review the week and plan the next", period = "weekly", is_key = true, eisen = "important", difficulty = "medium" },
]
args = "{{ item }}"
save = "habit_{{ i + 6 }}"

