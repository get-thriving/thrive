args = { schedule_stream_ref_id = "{{ ref(item['stream']) }}", name = "{{ item['name'] }}", start_date = "{{ day(item['offset']) }}", start_time_in_day = "{{ utc(item['time'], item['offset']) }}", duration_mins = "{{ item['mins'] }}" }

