worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Pictures are uploaded through here, and nginx turns away anything over 1m
    # by default. The WebUI scales photos down before sending them and the
    # WebAPI takes at most 4 MB (ADR 0018), so this leaves room for the form.
    client_max_body_size 8m;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Rate limiting (Optional)
    limit_req_zone $binary_remote_addr zone=limit_per_ip:10m rate=10r/s;

    # Load per-site configurations
    include /etc/nginx/conf.d/webui.conf;
}